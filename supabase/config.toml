# Dienstwerk – Supabase project configuration (local development via `supabase start`).
# Production values are set in the Supabase dashboard; keep both in sync.
project_id = "shiftcare"

[api]
enabled = true
port = 54321
# Only `public` is exposed. Helper functions live in `private` and are unreachable via the API.
schemas = ["public"]
extra_search_path = ["public", "extensions"]
max_rows = 1000

[db]
port = 54322
major_version = 17

[db.seed]
enabled = true
sql_paths = ["./seed.sql"]

[realtime]
enabled = true

[storage]
enabled = true
file_size_limit = "20MiB"

[auth]
enabled = true
site_url = "http://localhost:5173"
additional_redirect_urls = ["http://localhost:5173/", "http://localhost:5173/reset-password", "capacitor://localhost", "https://localhost", "dienstwerk://auth-callback", "dienstwerk://auth-callback/**"]
# Short-lived access tokens, rotating refresh tokens (session management).
jwt_expiry = 3600
enable_refresh_token_rotation = true
refresh_token_reuse_interval = 10
# Accounts are created by invitation (HR) – no public self sign-up.
enable_signup = false
minimum_password_length = 10
password_requirements = "lower_upper_letters_digits"

[auth.rate_limit]
sign_in_sign_ups = 30
token_verifications = 30
email_sent = 10

[auth.sessions]
# Log out after 12 h of inactivity (a long shift + handover).
inactivity_timeout = "12h"

[auth.email]
enable_signup = false
double_confirm_changes = true
enable_confirmations = true
secure_password_change = true
max_frequency = "60s"

[auth.mfa.totp]
enroll_enabled = true
verify_enabled = true

# Google Workspace / Gmail accounts
[auth.external.google]
enabled = true
client_id = "env(SUPABASE_AUTH_GOOGLE_CLIENT_ID)"
secret = "env(SUPABASE_AUTH_GOOGLE_SECRET)"
skip_nonce_check = false

# Microsoft Entra ID (Azure AD) – typical hospital identity provider
[auth.external.azure]
enabled = true
client_id = "env(SUPABASE_AUTH_AZURE_CLIENT_ID)"
secret = "env(SUPABASE_AUTH_AZURE_SECRET)"
# Restrict to one tenant in production, e.g. https://login.microsoftonline.com/<tenant-id>/v2.0
url = "env(SUPABASE_AUTH_AZURE_URL)"

[edge_runtime]
enabled = true
policy = "per_worker"

[functions.push-dispatch]
verify_jwt = false   # invoked by a database webhook / cron with the service-role secret

[functions.invite-employee]
verify_jwt = true
