# Live demo on GitHub Pages (https://<owner>.github.io/<repo>/).
# Requires Settings → Pages → Source = "GitHub Actions". See docs/DEMO.md.
# Backend: the public Pulshift demo project. URL and anon key are public by
# design (they ship in the browser bundle; access is enforced by RLS). Override
# them with the secrets or variables DEMO_SUPABASE_URL / DEMO_SUPABASE_ANON_KEY.
name: Demo (GitHub Pages)

on:
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: demo-pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - name: Build
        env:
          BASE_PATH: /${{ github.event.repository.name }}/
          VITE_SUPABASE_URL: ${{ secrets.DEMO_SUPABASE_URL || vars.DEMO_SUPABASE_URL || 'https://rcavkoetogzjrovoczuu.supabase.co' }}
          # The demo project has no Google/Microsoft sign-in configured.
          VITE_OAUTH_PROVIDERS: ${{ vars.DEMO_OAUTH_PROVIDERS || '' }}
          VITE_SUPABASE_ANON_KEY: ${{ secrets.DEMO_SUPABASE_ANON_KEY || vars.DEMO_SUPABASE_ANON_KEY || 'eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6InJjYXZrb2V0b2d6anJvdm9jenV1Iiwicm9sZSI6ImFub24iLCJpYXQiOjE3OTE2Mzk0ODgsImV4cCI6MjEwNzIxNTQ4OH0.Jz-AaEdz1vCwvbZSEilafJX3ZehUYBz_q_IylqjU578' }}
        run: |
          case "$VITE_SUPABASE_URL" in
            https://*) ;;
            *) echo "::error::DEMO_SUPABASE_URL ist keine https-URL (siehe docs/DEMO.md)"; exit 1 ;;
          esac
          npm run build
          # SPA fallback: GitHub Pages serves 404.html for unknown paths (deep links).
          cp dist/index.html dist/404.html
      - uses: actions/upload-pages-artifact@v3
        with:
          path: dist

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
