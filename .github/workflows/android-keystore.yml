# One-time: creates the Android upload key and stores it as repository
# secrets – no computer needed. The key never appears in logs or artifacts.
# Needs a fine-grained token with "Secrets: Read and write" on this repository
# in the secret GH_SECRETS_TOKEN (docs/RELEASE-OHNE-MAC.md, Schritt 5).
name: Android-Upload-Schlüssel erzeugen

on:
  workflow_dispatch:
    inputs:
      replace:
        description: Vorhandenen Schlüssel ersetzen (nur nach Rücksprache mit Google Play!)
        type: boolean
        default: false

permissions:
  contents: read

jobs:
  keystore:
    runs-on: ubuntu-latest
    env:
      GH_TOKEN: ${{ secrets.GH_SECRETS_TOKEN }}
      HAS_KEY: ${{ secrets.ANDROID_KEYSTORE_BASE64 != '' }}
    steps:
      - name: Checks
        run: |
          if [ -z "$GH_TOKEN" ]; then
            echo "::error::Secret GH_SECRETS_TOKEN fehlt (siehe docs/RELEASE-OHNE-MAC.md, Schritt 5)"; exit 1
          fi
          if [ "$HAS_KEY" = "true" ] && [ "${{ inputs.replace }}" != "true" ]; then
            echo "::error::Es gibt schon einen Upload-Schlüssel. Ein neuer Schlüssel passt nicht zu bereits hochgeladenen Builds."; exit 1
          fi
      - name: Generate and store
        run: |
          set -euo pipefail
          umask 077
          dir="$(mktemp -d)"
          pw="$(openssl rand -base64 32 | tr -d '/+=' | cut -c1-32)"
          echo "::add-mask::$pw"
          keytool -genkeypair -noprompt -keystore "$dir/upload.jks" -storetype PKCS12 -alias upload \
            -keyalg RSA -keysize 4096 -validity 10000 -storepass "$pw" -keypass "$pw" \
            -dname "CN=Dienstwerk Upload Key" > /dev/null 2>&1
          base64 -w0 "$dir/upload.jks" | gh secret set ANDROID_KEYSTORE_BASE64 --repo "$GITHUB_REPOSITORY"
          printf '%s' "$pw" | gh secret set ANDROID_KEYSTORE_PASSWORD --repo "$GITHUB_REPOSITORY"
          printf 'upload' | gh secret set ANDROID_KEY_ALIAS --repo "$GITHUB_REPOSITORY"
          fp="$(keytool -list -keystore "$dir/upload.jks" -storepass "$pw" -alias upload | grep -o 'SHA-256.*' || true)"
          rm -rf "$dir"
          {
            echo "### Android-Upload-Schlüssel gespeichert"
            echo "Die Secrets ANDROID_KEYSTORE_BASE64, ANDROID_KEYSTORE_PASSWORD und ANDROID_KEY_ALIAS sind gesetzt."
            echo ""
            echo "Fingerabdruck (öffentlich, zum Abgleich in der Play Console): \`$fp\`"
          } >> "$GITHUB_STEP_SUMMARY"
