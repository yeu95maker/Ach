# One-time: creates the StandFinder Android upload key and stores it as
# repository secrets (SF_ANDROID_*) – no computer needed. The key never appears
# in logs or artifacts. Needs a fine-grained token with "Secrets: Read and write"
# on this repository in the secret GH_SECRETS_TOKEN (marketplace/docs/APP-STORES.md, step 4).
name: StandFinder – create Android upload key

on:
  workflow_dispatch:
    inputs:
      replace:
        description: Replace the existing key (only after agreeing it with Google Play support!)
        type: boolean
        default: false

permissions:
  contents: read

jobs:
  keystore:
    runs-on: ubuntu-latest
    env:
      GH_TOKEN: ${{ secrets.GH_SECRETS_TOKEN }}
      HAS_KEY: ${{ secrets.SF_ANDROID_KEYSTORE_BASE64 != '' }}
    steps:
      - name: Checks
        run: |
          if [ -z "$GH_TOKEN" ]; then
            echo "::error::Secret GH_SECRETS_TOKEN is missing (marketplace/docs/APP-STORES.md, step 4)"; exit 1
          fi
          if [ "$HAS_KEY" = "true" ] && [ "${{ inputs.replace }}" != "true" ]; then
            echo "::error::An upload key already exists. A new key does not match builds that were already uploaded."; exit 1
          fi
      - name: Generate and store
        run: |
          set -euo pipefail
          umask 077
          dir="$(mktemp -d)"
          pw="$(openssl rand -base64 32 | tr -d '/+=' | cut -c1-32)"
          echo "::add-mask::$pw"
          keytool -genkeypair -noprompt -keystore "$dir/upload.jks" -storetype PKCS12 -alias upload \
            -keyalg RSA -keysize 4096 -validity 10000 -storepass "$pw" -keypass "$pw" \
            -dname "CN=StandFinder Upload Key" > /dev/null 2>&1
          base64 -w0 "$dir/upload.jks" | gh secret set SF_ANDROID_KEYSTORE_BASE64 --repo "$GITHUB_REPOSITORY"
          printf '%s' "$pw" | gh secret set SF_ANDROID_KEYSTORE_PASSWORD --repo "$GITHUB_REPOSITORY"
          printf 'upload' | gh secret set SF_ANDROID_KEY_ALIAS --repo "$GITHUB_REPOSITORY"
          fp="$(keytool -list -keystore "$dir/upload.jks" -storepass "$pw" -alias upload | grep -o 'SHA-256.*' || true)"
          rm -rf "$dir"
          {
            echo "### StandFinder Android upload key stored"
            echo "Secrets SF_ANDROID_KEYSTORE_BASE64, SF_ANDROID_KEYSTORE_PASSWORD and SF_ANDROID_KEY_ALIAS are set."
            echo ""
            echo "Upload key fingerprint (public, to compare in the Play Console): \`$fp\`"
          } >> "$GITHUB_STEP_SUMMARY"
