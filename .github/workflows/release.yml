# Store release: builds, signs and uploads the native apps – no Mac needed.
#   iOS:     archive on a GitHub macOS runner, Xcode cloud signing with an
#            App Store Connect API key, upload to App Store Connect → TestFlight.
#   Android: signed AAB (upload key from secrets); optional upload to the Play
#            internal track when PLAY_SERVICE_ACCOUNT_JSON is set.
# Start it from the Actions tab (also works in Safari on an iPad).
# Setup and the list of secrets: docs/RELEASE-OHNE-MAC.md
name: Store release

on:
  workflow_dispatch:
    inputs:
      platform:
        description: Welche App?
        type: choice
        options: [beide, ios, android]
        default: beide
      version:
        description: Versionsnummer (wie im Store sichtbar), z. B. 1.0.0
        required: true
        default: 1.0.0

permissions:
  contents: read

concurrency:
  group: store-release
  cancel-in-progress: false

env:
  BASE_PATH: /
  VERSION_NAME: ${{ inputs.version }}
  # Every run gets a higher build number than the one before.
  VERSION_CODE: ${{ github.run_number }}
  VITE_SUPABASE_URL: ${{ vars.APP_SUPABASE_URL || 'https://rcavkoetogzjrovoczuu.supabase.co' }}
  VITE_SUPABASE_ANON_KEY: ${{ vars.APP_SUPABASE_ANON_KEY || 'eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6InJjYXZrb2V0b2d6anJvdm9jenV1Iiwicm9sZSI6ImFub24iLCJpYXQiOjE3OTE2Mzk0ODgsImV4cCI6MjEwNzIxNTQ4OH0.Jz-AaEdz1vCwvbZSEilafJX3ZehUYBz_q_IylqjU578' }}
  VITE_OAUTH_PROVIDERS: ${{ vars.APP_OAUTH_PROVIDERS || '' }}
  VITE_NATIVE_PUSH: ${{ vars.APP_NATIVE_PUSH || 'false' }}
  VITE_LEGAL_BASE_URL: ${{ vars.APP_LEGAL_BASE_URL || 'https://yeu95maker.github.io/Ach/' }}

jobs:
  ios:
    if: inputs.platform != 'android'
    runs-on: macos-15
    env:
      ASC_KEY_ID: ${{ secrets.APP_STORE_CONNECT_KEY_ID }}
      ASC_ISSUER_ID: ${{ secrets.APP_STORE_CONNECT_ISSUER_ID }}
      ASC_KEY: ${{ secrets.APP_STORE_CONNECT_KEY }}
      TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}
    steps:
      - name: Check secrets
        run: |
          missing=""
          for v in ASC_KEY_ID ASC_ISSUER_ID ASC_KEY TEAM_ID; do [ -n "${!v}" ] || missing="$missing $v"; done
          if [ -n "$missing" ]; then
            echo "::error::Es fehlen GitHub-Secrets:$missing – siehe docs/RELEASE-OHNE-MAC.md, Schritt 3"
            exit 1
          fi
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run check
      - run: npm run build && npx cap sync ios
      - name: API key
        run: |
          mkdir -p "$RUNNER_TEMP/keys"
          printf '%s\n' "$ASC_KEY" > "$RUNNER_TEMP/keys/AuthKey_$ASC_KEY_ID.p8"
      - name: Archive (cloud signing)
        run: |
          xcodebuild -version
          xcodebuild -project ios/App/App.xcodeproj -scheme App -configuration Release \
            -destination 'generic/platform=iOS' -archivePath "$RUNNER_TEMP/App.xcarchive" \
            -allowProvisioningUpdates \
            -authenticationKeyPath "$RUNNER_TEMP/keys/AuthKey_$ASC_KEY_ID.p8" \
            -authenticationKeyID "$ASC_KEY_ID" -authenticationKeyIssuerID "$ASC_ISSUER_ID" \
            DEVELOPMENT_TEAM="$TEAM_ID" CODE_SIGN_STYLE=Automatic \
            MARKETING_VERSION="$VERSION_NAME" CURRENT_PROJECT_VERSION="$VERSION_CODE" \
            archive | tail -n 60
      - name: Upload to App Store Connect (TestFlight)
        run: |
          cat > "$RUNNER_TEMP/ExportOptions.plist" <<PLIST
          <?xml version="1.0" encoding="UTF-8"?>
          <!DOCTYPE plist PUBLIC "-//Apple//DTD PLIST 1.0//EN" "http://www.apple.com/DTDs/PropertyList-1.0.dtd">
          <plist version="1.0"><dict>
            <key>method</key><string>app-store-connect</string>
            <key>destination</key><string>upload</string>
            <key>teamID</key><string>$TEAM_ID</string>
            <key>signingStyle</key><string>automatic</string>
            <key>manageAppVersionAndBuildNumber</key><false/>
          </dict></plist>
          PLIST
          xcodebuild -exportArchive -archivePath "$RUNNER_TEMP/App.xcarchive" \
            -exportOptionsPlist "$RUNNER_TEMP/ExportOptions.plist" -exportPath "$RUNNER_TEMP/export" \
            -allowProvisioningUpdates \
            -authenticationKeyPath "$RUNNER_TEMP/keys/AuthKey_$ASC_KEY_ID.p8" \
            -authenticationKeyID "$ASC_KEY_ID" -authenticationKeyIssuerID "$ASC_ISSUER_ID" | tail -n 40
          echo "### iOS $VERSION_NAME ($VERSION_CODE) an App Store Connect übertragen" >> "$GITHUB_STEP_SUMMARY"
          echo "Nach 10–30 Minuten Verarbeitung erscheint der Build in TestFlight." >> "$GITHUB_STEP_SUMMARY"
      - name: Remove key
        if: always()
        run: rm -rf "$RUNNER_TEMP/keys"

  android:
    if: inputs.platform != 'ios'
    runs-on: ubuntu-latest
    env:
      KEYSTORE_B64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
      ANDROID_KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
      ANDROID_KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS || 'upload' }}
      ANDROID_KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD || secrets.ANDROID_KEYSTORE_PASSWORD }}
      PLAY_JSON: ${{ secrets.PLAY_SERVICE_ACCOUNT_JSON }}
    steps:
      - name: Check secrets
        run: |
          if [ -z "$KEYSTORE_B64" ] || [ -z "$ANDROID_KEYSTORE_PASSWORD" ]; then
            echo "::error::Es fehlt der Android-Upload-Schlüssel. Einmalig den Workflow „Android-Upload-Schlüssel erzeugen“ starten – siehe docs/RELEASE-OHNE-MAC.md, Schritt 5"
            exit 1
          fi
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 21
          cache: gradle
      - run: npm ci
      - run: npm run check
      - run: npm run build && npx cap sync android
      - name: Signed bundle
        run: |
          export ANDROID_KEYSTORE_PATH="$RUNNER_TEMP/upload.jks"
          printf '%s' "$KEYSTORE_B64" | base64 -d > "$ANDROID_KEYSTORE_PATH"
          (cd android && ./gradlew --no-daemon bundleRelease)
          rm -f "$ANDROID_KEYSTORE_PATH"
          "$JAVA_HOME/bin/jarsigner" -verify android/app/build/outputs/bundle/release/app-release.aab | grep -q "jar verified" \
            || { echo "::error::Das Bundle ist nicht signiert"; exit 1; }
          mv android/app/build/outputs/bundle/release/app-release.aab "Pulshift-$VERSION_NAME-$VERSION_CODE.aab"
      - uses: actions/upload-artifact@v4
        with:
          name: pulshift-android-${{ inputs.version }}-${{ github.run_number }}
          path: Pulshift-*.aab
          if-no-files-found: error
      - name: Upload to Google Play (internal testing)
        if: env.PLAY_JSON != ''
        uses: r0adkll/upload-google-play@v1.1.3
        with:
          serviceAccountJsonPlainText: ${{ secrets.PLAY_SERVICE_ACCOUNT_JSON }}
          packageName: app.pulshift # = appId in capacitor.config.ts
          releaseFiles: Pulshift-*.aab
          track: internal
          status: draft
      - name: Summary
        run: |
          echo "### Android $VERSION_NAME ($VERSION_CODE) signiert" >> "$GITHUB_STEP_SUMMARY"
          if [ -n "$PLAY_JSON" ]; then echo "In Google Play als Entwurf im internen Test hochgeladen." >> "$GITHUB_STEP_SUMMARY";
          else echo "Die AAB-Datei liegt unten unter *Artifacts*. In der Play Console unter *Testen → Interner Test* hochladen." >> "$GITHUB_STEP_SUMMARY"; fi
