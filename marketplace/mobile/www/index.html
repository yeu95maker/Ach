<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <title>StandFinder</title>
  <style>
    :root { color-scheme: light; }
    body { margin: 0; min-height: 100vh; display: flex; align-items: center; justify-content: center; background: #fff;
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif; color: #111827; text-align: center; padding: 24px; box-sizing: border-box; }
    .logo { width: 64px; height: 64px; border-radius: 16px; background: #12805e; color: #fff; font-size: 36px; line-height: 64px; margin: 0 auto 16px; }
    h1 { font-size: 20px; margin: 0 0 8px; }
    p { color: #4b5563; margin: 0 0 20px; line-height: 1.5; }
    button { background: #12805e; color: #fff; border: 0; border-radius: 12px; padding: 12px 24px; font-size: 16px; font-weight: 600; }
  </style>
</head>
<body>
  <main>
    <div class="logo" aria-hidden="true">⌂</div>
    <h1 id="title">You are offline</h1>
    <p id="text">StandFinder needs an internet connection. Check your connection and try again.</p>
    <button id="retry" type="button">Try again</button>
  </main>
  <script>
    if ((navigator.language || '').toLowerCase().startsWith('de')) {
      document.documentElement.lang = 'de'
      document.getElementById('title').textContent = 'Keine Verbindung'
      document.getElementById('text').textContent = 'StandFinder braucht eine Internetverbindung. Bitte prüfen Sie die Verbindung und versuchen Sie es erneut.'
      document.getElementById('retry').textContent = 'Erneut versuchen'
    }
    document.getElementById('retry').addEventListener('click', function () { window.location.reload() })
  </script>
</body>
</html>
